# Full stack: Postgres (JSONB notes + append-only audit trigger), FastAPI, Next.js PWA.
#   docker compose up --build
#   web  → http://localhost:3000   api → http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jeevia
      POSTGRES_PASSWORD: jeevia
      POSTGRES_DB: jeevia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeevia"]
      interval: 5s
      retries: 10
    ports:
      - "5433:5432"  # host 5433 avoids clashing with a local Postgres

  api:
    build: ./backend
    environment:
      JEEVIA_DATABASE_URL: postgresql+psycopg://jeevia:jeevia@db:5432/jeevia
      JEEVIA_JWT_SECRET: ${JEEVIA_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      JEEVIA_CORS_ORIGINS: http://localhost:3000
      JEEVIA_SEED_DEMO: "true"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_MODE: live
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
