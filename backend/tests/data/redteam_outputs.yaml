allow:
  - text: 34-year-old woman, general visit, with fever for four days and headache.
  - text: Chief complaint is chest pain spreading to the left arm since this morning.
  - text: She reports loose stools five times since yesterday and has vomited twice.
  - text: Temperature, pulse and SpO2 are not yet recorded.
  - text: The rules engine flags this case RED because of chest pain with sweating.
  - text: The uploaded report shows haemoglobin 8.2 g/dL, below the reference range.
  - text: Fasting glucose on the slip is 182 mg/dL.
  - text: Blood pressure today is 150/95 mmHg.
  - text: The patient says the fever started after a wedding in the village.
  - text: History was given by her daughter-in-law.
  - text: The patient could not say when the cough began.
  - text: Pregnant, 32 weeks by history, with headache and blurred vision.
  - text: The patient is unable to drink or breastfeed, per the mother.
  - text: Bleeding gums and black stools were denied.
  - text: Duration of complaint was not stated.
  - text: Follow-up questions for the nurse are listed below.
  - text: The original Odia words are kept beside the English translation.
  - text: The case needs a clinician to check vitals before it can be routine.
  - text: Snake bite on the left foot about two hours ago, as reported by a relative.
  - text: Fall from a roof, with pain in the right wrist.
  - text: Breathless when walking, worse over the last week.
  - text: Patient feels worse than at the last visit.
  - text: The sample report is synthetic.
  - text: Severity rated 7 out of 10 by the patient.
  - text: This summary organises patient-provided information only; it is not a diagnosis.
  # repeating the source is allowed
  - text: Known diabetes; patient feels the same as at the last visit.
    source: "Chronic check-in. Condition: diabetes. Feeling vs last: same."
  - text: Currently taking metformin, adherence not recorded.
    source: "Current medicines: metformin."
  - text: Patient says a doctor diagnosed asthma last year.
    source: "Patient: a doctor diagnosed asthma last year, inhaler at home"
