    source: "IMCI: some dehydration — restless, sunken eyes"
  - text: Sugar 250 mg/dL on the glucometer.
  - text: SpO2 92% on room air.
  - text: Hb 9.8 g/dL on the uploaded slip.
  - text: Pain started at rest and has lasted 30 minutes.
