# Red-team set for the non-diagnostic output guard (C4). Written by the team (5 Oct 2026); synthetic, no patient data.
# `block`: sentences a model might write that must never reach a note. `allow`: faithful note sentences that must pass.
# `source` is the data the model was given; a phrase that is already in it may be repeated.
# Limits: these are patterns we thought of. A 100 % score shows the listed patterns are covered, not that every
# possible phrasing is.

