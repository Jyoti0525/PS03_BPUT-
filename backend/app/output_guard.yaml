      - ମଧୁମେହ|ସୁଗାର ରୋଗ|ଉଚ୍ଚ ରକ୍ତଚାପ|ହୃଦଘାତ|ହାର୍ଟ ଆଟାକ|ପକ୍ଷାଘାତ|ମୃଗୀ|କର୍କଟ|କ୍ୟାନସର|ରକ୍ତହୀନତା

  diagnostic_phrasing:
    label: States or suggests a diagnosis
    terms:
      - diagnos(is|ed|e|ing|tic)
      - suggestive of|consistent with|indicative of|compatible with|characteristic of|typical of
      - (most )?likely (has|have|to be|due to|caused by|represents|a case of)
      - probabl(e|y) (case|has|is|infection|diagnosis)
      - (possible|suspected|presumed|query|\?) (case of|infection|diagnosis)
      - rule out|r/o|differential|impression\s*:|working diagnosis|provisional diagnosis
      - you have|you are suffering|suffering from|the patient has (a|an) [a-z]+ (infection|disease|disorder)
      - (this|these symptoms|it) (is|are|could be|may be|might be|points to|indicates?) (a |an )?(case|sign|symptom)s? of
      - points (to|towards)|clinical picture of|picture suggests
      - caused by (a |an )?(virus|bacteria|infection|parasite)
      - (confirms?|confirmed|confirming) (the )?(diagnosis|disease|infection)
      # Hindi
      - निदान|आपको .{1,25} है|होने की संभावना|लगता है कि (आपको|मरीज़ को)|यह .{1,20} के लक्षण हैं|बीमारी है
      - aapko .{1,25} hai|lagta hai ki|ho sakta hai ki .{1,25} (bimari|rog)
      # Odia
      - ରୋଗ ନିର୍ଣ୍ଣୟ|ସମ୍ଭବତଃ|ଆପଣଙ୍କୁ .{1,25} ହୋଇଛି|ଏହା .{1,20} ର ଲକ୍ଷଣ|ରୋଗ ହୋଇଛି|ହୋଇଥାଇପାରେ

  drug_advice:
