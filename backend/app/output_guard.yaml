      - tablet|\btab\.|capsule|syrup|injection|\binj\.|ointment|drip|\biv fluids?\b|nebuli[sz]ation|inhaler
      - antibiotics?|antivirals?|antimalarials?|antipyretics?|antifungals?|painkillers?|analgesics?|steroids?|anti-?inflammator(y|ies)
      - paracetamol|acetaminophen|crocin|dolo|calpol|ibuprofen|brufen|diclofenac|aspirin|ecosprin|nimesulide
      - amoxicillin|augmentin|azithromycin|ciprofloxacin|ofloxacin|norfloxacin|metronidazole|doxycycline|ceftriaxone|cefixime|cotrimoxazole
      - artesunate|artemether|chloroquine|primaquine|isoniazid|rifampicin|ethambutol|pyrazinamide
