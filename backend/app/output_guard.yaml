      - hypertension|hypertensive|hypotension
      - anaemia|anemia|anaemic|anemic|thalassaemia|thalassemia|sickle cell
      - kidney failure|renal failure|kidney disease|\bckd\b|kidney stone|renal colic
      - hypothyroidism|hyperthyroidism|thyroid disease
      - dehydration|dehydrated
      # pregnancy
      - pre-?eclampsia|eclampsia|ectopic pregnancy|miscarriage|abortion|placenta pr(a)?evia|abruption|gestational diabetes
      # surgical, injury, other
      - appendicitis|cholecystitis|pancreatitis|peritonitis|intestinal obstruction|hernia
      - fracture|dislocation|concussion|haemorrhage|hemorrhage|internal bleeding
      - cancer|tumou?r|malignan(t|cy)|carcinoma|leuk(a)?emia|lymphoma
