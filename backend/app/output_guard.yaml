      # heart, lungs, brain
      - heart attack|myocardial infarction|\bmi\b|\bstemi\b|\bnstemi\b|acute coronary syndrome|\bacs\b
      - angina|heart failure|cardiac arrest|arrhythmia|atrial fibrillation|cardiomyopathy
      - stroke|cerebrovascular accident|\bcva\b|\btia\b|paralysis|hemiplegia
      - asthma|\bcopd\b|emphysema|pulmonary embolism|pneumothorax
      - silicosis|pneumoconiosis|asbestosis|byssinosis|occupational lung disease
