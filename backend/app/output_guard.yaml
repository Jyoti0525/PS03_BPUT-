# Non-diagnostic output guard (C4). Every sentence a language model writes for a note passes through this list.
# A match blocks the sentence unless the same words already appear in the data the model was given (what the patient
# said, the record, the rules engine) — the model may repeat, never add. Matching is case-insensitive on NFKC text.
# Entries are regular expressions; \b is applied around Latin entries automatically, Indic entries match as written.
version: 1

# Removed before matching: disclaimers that mention a diagnosis only to deny it.
safe_phrases:
  - (it|this|this summary|this note|this tool) (is|does) not (a diagnosis|diagnose)
  - not a diagnosis
  - non-diagnostic

categories:
  condition:
    label: Names a disease or condition
    terms:
      # infections and fevers
      - dengue|dengu|dengi
      - malaria|maleria|malarial
      - typhoid|tyfoid|enteric fever
      - chikungunya|chikungunia
      - tuberculosis|\btb\b|koch'?s
      - pneumonia|pneumonitis|numonia
      - bronchitis|bronchiolitis
      - influenza|\bflu\b|h1n1|swine flu
      - covid(-?19)?|coronavirus|sars-cov-2
      - sepsis|septic|septicaemia|septicemia
      - meningitis|encephalitis|cerebral malaria
      - cholera|dysentery|gastroenteritis|gastritis
      - hepatitis|jaundice|cirrhosis
      - urinary tract infection|\buti\b|pyelonephritis
      - (viral|bacterial|fungal) (infection|fever)
      - leptospirosis|scrub typhus|kala[- ]azar|filariasis|japanese encephalitis
      - leprosy|scabies|cellulitis|abscess
