# Facility-configurable rules. These are NOT from a published triage protocol; the reviewer screen
# labels them "Local facility rule" so they are never mistaken for guideline criteria.
protocol: LOCAL
name: Local facility rules
source: local
applies: {}
rules:
  - id: LOCAL-GLUCOSE-HIGH
    description: Point-of-care blood glucose above 300 mg/dL
    urgency: yellow
    when: { vital_if_measured: [glucose, gt, 300] }
  - id: LOCAL-HAEMOPTYSIS
    description: Coughing blood (screen for TB and other causes)
    urgency: yellow
    when: { finding: haemoptysis }
  - id: LOCAL-ACS-FEATURES
    description: Chest pain spreading to arm, jaw or back, or with sweating (features of acute coronary syndrome) — whatever the onset
    urgency: red
    when: { all: [ { finding: chest_pain }, { any: [ { finding: chest_pain_radiating }, { finding: sweating } ] } ] }
  - id: LOCAL-SEVERE-HTN
    description: Severe hypertension (systolic ≥ 180 or diastolic ≥ 110 mmHg), or ≥ 160 / ≥ 100 with headache, visual change, chest pain, breathlessness or one-sided weakness — needs a doctor today
    urgency: yellow
    review_by: doctor
    when:
      any:
        - vital_if_measured: [bp_systolic, gte, 180]
        - vital_if_measured: [bp_diastolic, gte, 110]
        - all:
            - any: [ { vital_if_measured: [bp_systolic, gte, 160] }, { vital_if_measured: [bp_diastolic, gte, 100] } ]
            - any: [ { finding: headache }, { finding: visual_disturbance }, { finding: chest_pain }, { finding: breathless }, { finding: one_sided_weakness } ]
  - id: NTEP-PRESUMPTIVE-TB
    description: Presumptive TB (cough or fever for 2 weeks or more, or cough with weight loss or night sweats) — sputum test (NAAT) referral today
    urgency: yellow
    source: ntep
    when:
      any:
        - all: [ { finding: cough }, { any: [ { finding: weight_loss }, { finding: night_sweats } ] } ]
        - all: [ { any: [ { finding: cough }, { finding: fever } ] }, { onset_hours: [gte, 336] } ]
        - finding: cough_long
  - id: LOCAL-POSSIBLE-ECTOPIC
    description: Late period or pregnancy with stomach pain, bleeding or fainting — pregnancy test and doctor today (rule out ectopic pregnancy)
    urgency: yellow
    review_by: doctor
    when:
      all:
        - any: [ { finding: pregnancy_possible }, { finding: pregnant } ]
        - any: [ { finding: abdominal_pain }, { finding: vaginal_bleeding }, { finding: syncope } ]
  - id: GINA-ASTHMA-LOW-SPO2
    description: Asthma or wheeze with SpO₂ below 94 % — not a mild flare; treat now and reassess within the hour
    urgency: yellow
    source: gina
    when: { all: [ { any: [ { finding: asthma }, { finding: wheeze } ] }, { vital: [spo2, lt, 94] } ] }
