# Long-term conditions as the patient would hear them. Anything else is said as recorded.
conditions:
  diabetes: { en: "diabetes", hi: "शुगर (मधुमेह)", or: "ସୁଗାର (ମଧୁମେହ)", bn: "সুগার (ডায়াবেটিস)", ta: "சர்க்கரை நோய்", te: "షుగర్ (మధుమేహం)", gu: "ડાયાબિટીસ (સુગર)", kn: "ಸಕ್ಕರೆ ಕಾಯಿಲೆ (ಮಧುಮೇಹ)", ml: "ഷുഗർ (പ്രമേഹം)", mr: "शुगर (मधुमेह)", pa: "ਸ਼ੂਗਰ" }
  hypertension: { en: "blood pressure", hi: "ब्लड प्रेशर", or: "ରକ୍ତଚାପ", bn: "ব্লাড প্রেশার", ta: "இரத்த அழுத்தம்", te: "బీపీ (రక్తపోటు)", gu: "બ્લડ પ્રેશર", kn: "ಬಿಪಿ (ರಕ್ತದೊತ್ತಡ)", ml: "ബിപി (രക്തസമ്മർദ്ദം)", mr: "बीपी (रक्तदाब)", pa: "ਬੀਪੀ (ਬਲੱਡ ਪ੍ਰੈਸ਼ਰ)" }
