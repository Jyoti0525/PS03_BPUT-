# E6 · Reminder calls (simulated in the browser; no telephony in this build).
#
# The agent only does logistics (the check-up is due, can you come) and bounded collection (yes / no questions about
# danger signs). It never answers with advice: India's Telemedicine Practice Guidelines 2020 do not let an AI platform
# counsel a patient. Any danger sign ends the call at once and pages a person; so does an answer the rules cannot read
# on a danger-sign question (unknown is never normal). A call where every answer is "no" is weak evidence: the in-person
# visit is still needed.
#
# Danger signs are finding ids from triage/findings.py, so the same multilingual lexicon (English, Hindi, Odia, with
# negation) reads the patient's words on the call as at intake. `sources` are ids in triage/rules/sources.yaml.
#
# Lines are fixed text written for this build in the 11 languages Sarvam's Bulbul voice speaks. Bengali, Tamil,
# Telugu, Gujarati, Kannada, Malayalam, Marathi and Punjabi were checked by translating each back to English with
# the offline IndicTrans2 model (scripts/check_call_lines.py); all but Hindi need a native speaker's check before a
# field pilot.

red_flags:
  # Any of these, said anywhere in any answer, ends the call and pages a person. Sources as in the rule packs.
  general:
    sources: [atp, aiims_hrc]
    findings: [unresponsive, altered_mental_status, seizure, chest_pain, chest_pain_radiating, breathless, one_sided_weakness,
               syncope, bleeding_heavy, haematemesis, poisoning, snake_bite, headache_sudden, fall_from_height]
  maternal:
    # WHO PCPNC danger signs in pregnancy; headache on its own counts, because blood pressure cannot be measured on a
    # call and a headache with raised blood pressure is a pre-eclampsia feature (ISSHP); reduced movements per RCOG.
    sources: [who_pcpnc, isshp, rcog_rfm]
    findings: [vaginal_bleeding, bleeding, fluid_leaking, labour_pains, headache, visual_disturbance, swelling_face_hands,
               reduced_fetal_movement, fever, abdominal_pain, upper_abdominal_pain, weakness_general]
  chronic:
    # AIIMS 2025 high-risk complaints and ATP RED discriminators that a person with diabetes or high blood pressure
    # may report at home.
    sources: [aiims_hrc, atp]
    findings: [visual_disturbance, vomits_everything]

# Lines in each language. {name} is the first name only; {facility}, {date} and {condition} are filled in.
lines:
  intro:
    en: "Namaste. This is an automated call from {facility}. Am I speaking with {name}?"
    hi: "नमस्ते। यह {facility} से एक स्वचालित कॉल है। क्या मेरी बात {name} से हो रही है?"
    or: "ନମସ୍କାର। ଏହା {facility}ରୁ ଏକ ସ୍ୱୟଂଚାଳିତ କଲ୍। ମୁଁ କ'ଣ {name}ଙ୍କ ସହ କଥା ହେଉଛି?"
    bn: "নমস্কার। এটি {facility} থেকে একটি স্বয়ংক্রিয় কল। আমি কি {name}-এর সঙ্গে কথা বলছি?"
    ta: "வணக்கம். இது {facility}-இலிருந்து வரும் ஒரு தானியங்கி அழைப்பு. நான் {name} அவர்களுடன் பேசுகிறேனா?"
    te: "నమస్కారం. ఇది {facility} నుండి వస్తున్న ఒక ఆటోమేటెడ్ కాల్. నేను {name} గారితో మాట్లాడుతున్నానా?"
    gu: "નમસ્તે. આ {facility} તરફથી એક સ્વચાલિત કૉલ છે. શું હું {name} સાથે વાત કરી રહી છું?"
    kn: "ನಮಸ್ಕಾರ. ಇದು {facility} ಇಂದ ಬಂದಿರುವ ಒಂದು ಸ್ವಯಂಚಾಲಿತ ಕರೆ. ನಾನು {name} ಅವರೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಿದ್ದೇನೆಯೇ?"
    ml: "നമസ്കാരം. ഇത് {facility}-ൽ നിന്നുള്ള ഒരു ഓട്ടോമേറ്റഡ് കോൾ ആണ്. ഞാൻ {name}-നോടാണോ സംസാരിക്കുന്നത്?"
    mr: "नमस्कार. हा {facility} कडून आलेला एक स्वयंचलित कॉल आहे. मी {name} यांच्याशी बोलत आहे का?"
    pa: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ। ਇਹ {facility} ਤੋਂ ਇੱਕ ਸਵੈਚਾਲਿਤ ਕਾਲ ਹੈ। ਕੀ ਮੇਰੀ ਗੱਲ {name} ਨਾਲ ਹੋ ਰਹੀ ਹੈ?"
  neutral:
    # For a phone that is not hers (maternal), or when someone else answers: nothing about health is said.
    en: "Namaste. This is an automated call from {facility}. Please ask {name} to visit {facility} this week. Will you tell {name}?"
    hi: "नमस्ते। यह {facility} से एक स्वचालित कॉल है। कृपया {name} से कहिए कि वे इस हफ़्ते {facility} आएँ। क्या आप उन्हें बता देंगे?"
    or: "ନମସ୍କାର। ଏହା {facility}ରୁ ଏକ ସ୍ୱୟଂଚାଳିତ କଲ୍। ଦୟାକରି {name}ଙ୍କୁ କୁହନ୍ତୁ ଯେ ସେ ଏହି ସପ୍ତାହରେ {facility} ଆସନ୍ତୁ। ଆପଣ ତାଙ୍କୁ କହିଦେବେ କି?"
    bn: "নমস্কার। এটি {facility} থেকে একটি স্বয়ংক্রিয় কল। অনুগ্রহ করে {name}-কে বলুন এই সপ্তাহে {facility}-তে আসতে। আপনি কি {name}-কে জানিয়ে দেবেন?"
    ta: "வணக்கம். இது {facility}-இலிருந்து வரும் ஒரு தானியங்கி அழைப்பு. தயவுசெய்து {name} அவர்களை இந்த வாரம் {facility}-க்கு வரச் சொல்லுங்கள். நீங்கள் அவரிடம் சொல்வீர்களா?"
    te: "నమస్కారం. ఇది {facility} నుండి వస్తున్న ఒక ఆటోమేటెడ్ కాల్. దయచేసి {name} గారిని ఈ వారం {facility}కి రమ్మని చెప్పండి. మీరు వారికి చెబుతారా?"
    gu: "નમસ્તે. આ {facility} તરફથી એક સ્વચાલિત કૉલ છે. કૃપા કરીને {name}ને કહો કે તેઓ આ અઠવાડિયે {facility} આવે. શું તમે તેમને કહી દેશો?"
    kn: "ನಮಸ್ಕಾರ. ಇದು {facility} ಇಂದ ಬಂದಿರುವ ಒಂದು ಸ್ವಯಂಚಾಲಿತ ಕರೆ. ದಯವಿಟ್ಟು {name} ಅವರಿಗೆ ಈ ವಾರ {facility}ಗೆ ಬರಲು ಹೇಳಿ. ನೀವು ಅವರಿಗೆ ತಿಳಿಸುತ್ತೀರಾ?"
    ml: "നമസ്കാരം. ഇത് {facility}-ൽ നിന്നുള്ള ഒരു ഓട്ടോമേറ്റഡ് കോൾ ആണ്. ദയവായി {name}-നോട് ഈ ആഴ്ച {facility}-ൽ വരാൻ പറയൂ. നിങ്ങൾ അവരോട് പറയുമോ?"
    mr: "नमस्कार. हा {facility} कडून आलेला एक स्वयंचलित कॉल आहे. कृपया {name} यांना या आठवड्यात {facility} येथे यायला सांगा. तुम्ही त्यांना सांगाल का?"
    pa: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ। ਇਹ {facility} ਤੋਂ ਇੱਕ ਸਵੈਚਾਲਿਤ ਕਾਲ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ {name} ਨੂੰ ਕਹੋ ਕਿ ਉਹ ਇਸ ਹਫ਼ਤੇ {facility} ਆਉਣ। ਕੀ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਦੱਸ ਦਿਓਗੇ?"
  neutral_other:
    en: "Then please ask {name} to visit {facility} this week. Will you tell {name}?"
    hi: "तो कृपया {name} से कहिए कि वे इस हफ़्ते {facility} आएँ। क्या आप उन्हें बता देंगे?"
    or: "ତେବେ ଦୟାକରି {name}ଙ୍କୁ କୁହନ୍ତୁ ଯେ ସେ ଏହି ସପ୍ତାହରେ {facility} ଆସନ୍ତୁ। ଆପଣ ତାଙ୍କୁ କହିଦେବେ କି?"
    bn: "তাহলে অনুগ্রহ করে {name}-কে বলুন এই সপ্তাহে {facility}-তে আসতে। আপনি কি {name}-কে জানিয়ে দেবেন?"
    ta: "அப்படியானால், தயவுசெய்து {name} அவர்களை இந்த வாரம் {facility}-க்கு வரச் சொல்லுங்கள். நீங்கள் அவரிடம் சொல்வீர்களா?"
    te: "అయితే దయచేసి {name} గారిని ఈ వారం {facility}కి రమ్మని చెప్పండి. మీరు వారికి చెబుతారా?"
    gu: "તો કૃપા કરીને {name}ને કહો કે તેઓ આ અઠવાડિયે {facility} આવે. શું તમે તેમને કહી દેશો?"
    kn: "ಹಾಗಾದರೆ ದಯವಿಟ್ಟು {name} ಅವರಿಗೆ ಈ ವಾರ {facility}ಗೆ ಬರಲು ಹೇಳಿ. ನೀವು ಅವರಿಗೆ ತಿಳಿಸುತ್ತೀರಾ?"
    ml: "എങ്കിൽ ദയവായി {name}-നോട് ഈ ആഴ്ച {facility}-ൽ വരാൻ പറയൂ. നിങ്ങൾ അവരോട് പറയുമോ?"
    mr: "मग कृपया {name} यांना या आठवड्यात {facility} येथे यायला सांगा. तुम्ही त्यांना सांगाल का?"
    pa: "ਤਾਂ ਕਿਰਪਾ ਕਰਕੇ {name} ਨੂੰ ਕਹੋ ਕਿ ਉਹ ਇਸ ਹਫ਼ਤੇ {facility} ਆਉਣ। ਕੀ ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਨੂੰ ਦੱਸ ਦਿਓਗੇ?"
  thanks:
    en: "Thank you. Goodbye."
    hi: "धन्यवाद। नमस्ते।"
    or: "ଧନ୍ୟବାଦ। ନମସ୍କାର।"
    bn: "ধন্যবাদ। নমস্কার।"
    ta: "நன்றி. வணக்கம்."
    te: "ధన్యవాదాలు. నమస్కారం."
    gu: "આભાર. નમસ્તે."
    kn: "ಧನ್ಯವಾದಗಳು. ನಮಸ್ಕಾರ."
    ml: "നന്ദി. നമസ്കാരം."
    mr: "धन्यवाद. नमस्कार."
    pa: "ਧੰਨਵਾਦ। ਸਤ ਸ੍ਰੀ ਅਕਾਲ।"
  reprompt:
    en: "Sorry, I did not understand. Please say yes or no."
    hi: "माफ़ कीजिए, मैं समझ नहीं पाई। कृपया हाँ या ना कहिए।"
    or: "କ୍ଷମା କରିବେ, ମୁଁ ବୁଝିପାରିଲି ନାହିଁ। ଦୟାକରି ହଁ କିମ୍ବା ନା କୁହନ୍ତୁ।"
    bn: "দুঃখিত, আমি বুঝতে পারিনি। অনুগ্রহ করে হ্যাঁ অথবা না বলুন।"
    ta: "மன்னிக்கவும், எனக்குப் புரியவில்லை. தயவுசெய்து ஆம் அல்லது இல்லை என்று சொல்லுங்கள்."
    te: "క్షమించండి, నాకు అర్థం కాలేదు. దయచేసి అవును లేదా కాదు అని చెప్పండి."
    gu: "માફ કરશો, હું સમજી નહીં. કૃપા કરીને હા અથવા ના કહો."
    kn: "ಕ್ಷಮಿಸಿ, ನನಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ. ದಯವಿಟ್ಟು ಹೌದು ಅಥವಾ ಇಲ್ಲ ಎಂದು ಹೇಳಿ."
    ml: "ക്ഷമിക്കണം, എനിക്ക് മനസ്സിലായില്ല. ദയവായി അതെ അല്ലെങ്കിൽ ഇല്ല എന്ന് പറയൂ."
    mr: "माफ करा, मला समजले नाही. कृपया हो किंवा नाही असे सांगा."
    pa: "ਮਾਫ਼ ਕਰਨਾ, ਮੈਨੂੰ ਸਮਝ ਨਹੀਂ ਆਈ। ਕਿਰਪਾ ਕਰਕੇ ਹਾਂ ਜਾਂ ਨਹੀਂ ਕਹੋ।"
  end_danger:
    # Logistics only: no reassurance, no advice. A person calls back.
    en: "Thank you for telling me. I am ending this call now so that a health worker can call you back straight away. Please keep your phone with you."
    hi: "बताने के लिए धन्यवाद। मैं यह कॉल अभी बंद कर रही हूँ ताकि एक स्वास्थ्य कर्मी आपको तुरंत वापस कॉल करें। कृपया फ़ोन अपने पास रखिए।"
    or: "କହିଥିବାରୁ ଧନ୍ୟବାଦ। ମୁଁ ଏବେ ଏହି କଲ୍ ବନ୍ଦ କରୁଛି, ଯେପରି ଜଣେ ସ୍ୱାସ୍ଥ୍ୟକର୍ମୀ ଆପଣଙ୍କୁ ତୁରନ୍ତ ଫୋନ୍ କରିବେ। ଦୟାକରି ଫୋନ୍ ପାଖରେ ରଖନ୍ତୁ।"
    bn: "জানানোর জন্য ধন্যবাদ। আমি এখন এই কলটি শেষ করছি, যাতে একজন স্বাস্থ্যকর্মী আপনাকে এখনই ফোন করতে পারেন। অনুগ্রহ করে ফোনটি কাছে রাখুন।"
    ta: "சொன்னதற்கு நன்றி. ஒரு சுகாதாரப் பணியாளர் உடனே உங்களைத் திரும்ப அழைக்க, நான் இந்த அழைப்பை இப்போது முடிக்கிறேன். தயவுசெய்து தொலைபேசியை உங்கள் அருகில் வைத்திருங்கள்."
    te: "చెప్పినందుకు ధన్యవాదాలు. ఒక ఆరోగ్య కార్యకర్త మీకు వెంటనే తిరిగి ఫోన్ చేసేందుకు, నేను ఇప్పుడు ఈ కాల్‌ను ముగిస్తున్నాను. దయచేసి ఫోన్‌ను మీ దగ్గరే ఉంచుకోండి."
    gu: "જણાવવા બદલ આભાર. હું હવે આ કૉલ બંધ કરું છું, જેથી એક આરોગ્ય કાર્યકર તમને તરત પાછો ફોન કરી શકે. કૃપા કરીને ફોન તમારી પાસે રાખો."
    kn: "ತಿಳಿಸಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ಒಬ್ಬ ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರು ನಿಮಗೆ ತಕ್ಷಣ ಮರಳಿ ಕರೆ ಮಾಡಲು, ನಾನು ಈಗ ಈ ಕರೆಯನ್ನು ಮುಗಿಸುತ್ತಿದ್ದೇನೆ. ದಯವಿಟ್ಟು ಫೋನ್ ಅನ್ನು ನಿಮ್ಮ ಬಳಿಯೇ ಇಟ್ಟುಕೊಳ್ಳಿ."
    ml: "പറഞ്ഞതിന് നന്ദി. ആരോഗ്യ പ്രവർത്തകർക്ക് നിങ്ങളെ ഉടൻ തിരികെ വിളിക്കാനായി ഞാൻ ഇപ്പോൾ ഈ കോൾ അവസാനിപ്പിക്കുകയാണ്. ദയവായി ഫോൺ അടുത്തുതന്നെ വെക്കൂ."
    mr: "सांगितल्याबद्दल धन्यवाद. एका आरोग्य कर्मचाऱ्याने तुम्हाला लगेच परत फोन करावा म्हणून मी आता हा कॉल बंद करत आहे. कृपया फोन तुमच्याजवळ ठेवा."
    pa: "ਦੱਸਣ ਲਈ ਧੰਨਵਾਦ। ਮੈਂ ਹੁਣ ਇਹ ਕਾਲ ਬੰਦ ਕਰ ਰਹੀ ਹਾਂ ਤਾਂ ਜੋ ਇੱਕ ਸਿਹਤ ਕਰਮਚਾਰੀ ਤੁਹਾਨੂੰ ਤੁਰੰਤ ਵਾਪਸ ਫ਼ੋਨ ਕਰੇ। ਕਿਰਪਾ ਕਰਕੇ ਫ਼ੋਨ ਆਪਣੇ ਕੋਲ ਰੱਖੋ।"
  end_unclear:
    en: "I could not understand. A health worker will call you back. Thank you."
    hi: "मुझे समझ नहीं आया। एक स्वास्थ्य कर्मी आपको वापस कॉल करेंगे। धन्यवाद।"
    or: "ମୁଁ ବୁଝିପାରିଲି ନାହିଁ। ଜଣେ ସ୍ୱାସ୍ଥ୍ୟକର୍ମୀ ଆପଣଙ୍କୁ ଫୋନ୍ କରିବେ। ଧନ୍ୟବାଦ।"
    bn: "আমি বুঝতে পারিনি। একজন স্বাস্থ্যকর্মী আপনাকে ফোন করবেন। ধন্যবাদ।"
    ta: "எனக்குப் புரியவில்லை. ஒரு சுகாதாரப் பணியாளர் உங்களைத் திரும்ப அழைப்பார். நன்றி."
    te: "నాకు అర్థం కాలేదు. ఒక ఆరోగ్య కార్యకర్త మీకు తిరిగి ఫోన్ చేస్తారు. ధన్యవాదాలు."
    gu: "હું સમજી નહીં. એક આરોગ્ય કાર્યકર તમને પાછો ફોન કરશે. આભાર."
    kn: "ನನಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ. ಒಬ್ಬ ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರು ನಿಮಗೆ ಮರಳಿ ಕರೆ ಮಾಡುತ್ತಾರೆ. ಧನ್ಯವಾದಗಳು."
    ml: "എനിക്ക് മനസ്സിലായില്ല. ആരോഗ്യ പ്രവർത്തകർ നിങ്ങളെ തിരികെ വിളിക്കും. നന്ദി."
    mr: "मला समजले नाही. एक आरोग्य कर्मचारी तुम्हाला परत फोन करतील. धन्यवाद."
    pa: "ਮੈਨੂੰ ਸਮਝ ਨਹੀਂ ਆਈ। ਇੱਕ ਸਿਹਤ ਕਰਮਚਾਰੀ ਤੁਹਾਨੂੰ ਵਾਪਸ ਫ਼ੋਨ ਕਰਨਗੇ। ਧੰਨਵਾਦ।"
  end_come:
    en: "Thank you. Your answers are noted for your health worker. Please come for your check-up this week."
    hi: "धन्यवाद। आपके जवाब आपके स्वास्थ्य कर्मी के लिए लिख लिए गए हैं। कृपया इस हफ़्ते जाँच के लिए आइए।"
    or: "ଧନ୍ୟବାଦ। ଆପଣଙ୍କ ଉତ୍ତର ସ୍ୱାସ୍ଥ୍ୟକର୍ମୀଙ୍କ ପାଇଁ ଲେଖି ରଖାଗଲା। ଦୟାକରି ଏହି ସପ୍ତାହରେ ଯାଞ୍ଚ ପାଇଁ ଆସନ୍ତୁ।"
    bn: "ধন্যবাদ। আপনার উত্তরগুলি আপনার স্বাস্থ্যকর্মীর জন্য লিখে রাখা হল। অনুগ্রহ করে এই সপ্তাহে পরীক্ষার জন্য আসুন।"
    ta: "நன்றி. உங்கள் பதில்கள் உங்கள் சுகாதாரப் பணியாளருக்காகக் குறித்துக்கொள்ளப்பட்டன. தயவுசெய்து இந்த வாரம் பரிசோதனைக்கு வாருங்கள்."
    te: "ధన్యవాదాలు. మీ సమాధానాలు మీ ఆరోగ్య కార్యకర్త కోసం నమోదు చేయబడ్డాయి. దయచేసి ఈ వారం పరీక్ష కోసం రండి."
    gu: "આભાર. તમારા જવાબો તમારા આરોગ્ય કાર્યકર માટે નોંધી લીધા છે. કૃપા કરીને આ અઠવાડિયે તપાસ માટે આવો."
    kn: "ಧನ್ಯವಾದಗಳು. ನಿಮ್ಮ ಉತ್ತರಗಳನ್ನು ನಿಮ್ಮ ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರಿಗಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಈ ವಾರ ತಪಾಸಣೆಗೆ ಬನ್ನಿ."
    ml: "നന്ദി. നിങ്ങളുടെ ഉത്തരങ്ങൾ ആരോഗ്യ പ്രവർത്തകർക്കായി രേഖപ്പെടുത്തിയിട്ടുണ്ട്. ദയവായി ഈ ആഴ്ച പരിശോധനയ്ക്ക് വരൂ."
    mr: "धन्यवाद. तुमची उत्तरे तुमच्या आरोग्य कर्मचाऱ्यासाठी नोंदवली आहेत. कृपया या आठवड्यात तपासणीसाठी या."
    pa: "ਧੰਨਵਾਦ। ਤੁਹਾਡੇ ਜਵਾਬ ਤੁਹਾਡੇ ਸਿਹਤ ਕਰਮਚਾਰੀ ਲਈ ਲਿਖ ਲਏ ਗਏ ਹਨ। ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਹਫ਼ਤੇ ਚੈੱਕਅੱਪ ਲਈ ਆਓ।"
  end_visit:
    en: "Thank you. Your answers are noted. Your health worker will come to see you."
    hi: "धन्यवाद। आपके जवाब लिख लिए गए हैं। आपके स्वास्थ्य कर्मी आपसे मिलने आएँगे।"
    or: "ଧନ୍ୟବାଦ। ଆପଣଙ୍କ ଉତ୍ତର ଲେଖି ରଖାଗଲା। ଆପଣଙ୍କ ସ୍ୱାସ୍ଥ୍ୟକର୍ମୀ ଆପଣଙ୍କୁ ଭେଟିବାକୁ ଆସିବେ।"
    bn: "ধন্যবাদ। আপনার উত্তরগুলি লিখে রাখা হল। আপনার স্বাস্থ্যকর্মী আপনার সঙ্গে দেখা করতে আসবেন।"
    ta: "நன்றி. உங்கள் பதில்கள் குறித்துக்கொள்ளப்பட்டன. உங்கள் சுகாதாரப் பணியாளர் உங்களைப் பார்க்க வருவார்."
    te: "ధన్యవాదాలు. మీ సమాధానాలు నమోదు చేయబడ్డాయి. మీ ఆరోగ్య కార్యకర్త మిమ్మల్ని చూడటానికి వస్తారు."
    gu: "આભાર. તમારા જવાબો નોંધી લીધા છે. તમારા આરોગ્ય કાર્યકર તમને મળવા આવશે."
    kn: "ಧನ್ಯವಾದಗಳು. ನಿಮ್ಮ ಉತ್ತರಗಳನ್ನು ದಾಖಲಿಸಲಾಗಿದೆ. ನಿಮ್ಮ ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರು ನಿಮ್ಮನ್ನು ನೋಡಲು ಬರುತ್ತಾರೆ."
    ml: "നന്ദി. നിങ്ങളുടെ ഉത്തരങ്ങൾ രേഖപ്പെടുത്തിയിട്ടുണ്ട്. ആരോഗ്യ പ്രവർത്തകർ നിങ്ങളെ കാണാൻ വരും."
    mr: "धन्यवाद. तुमची उत्तरे नोंदवली आहेत. तुमचे आरोग्य कर्मचारी तुम्हाला भेटायला येतील."
    pa: "ਧੰਨਵਾਦ। ਤੁਹਾਡੇ ਜਵਾਬ ਲਿਖ ਲਏ ਗਏ ਹਨ। ਤੁਹਾਡੇ ਸਿਹਤ ਕਰਮਚਾਰੀ ਤੁਹਾਨੂੰ ਮਿਲਣ ਆਉਣਗੇ।"

# The questions, in order. kind: identity | logistics | danger (flag_on yes/no → the listed findings) | note
# (recorded for the reviewer, never urgent) | free (anything else; scanned for danger signs, otherwise noted).
scripts:
  maternal:
    - key: identity
      kind: identity
    - key: come
      kind: logistics
      en: "Your pregnancy check-up was due on {date}. Can you come to {facility} this week?"
      hi: "आपकी गर्भावस्था जाँच {date} को होनी थी। क्या आप इस हफ़्ते {facility} आ सकती हैं?"
      or: "ଆପଣଙ୍କ ଗର୍ଭାବସ୍ଥା ଯାଞ୍ଚ {date}ରେ ହେବାର ଥିଲା। ଆପଣ ଏହି ସପ୍ତାହରେ {facility} ଆସିପାରିବେ କି?"
      bn: "আপনার গর্ভাবস্থার পরীক্ষা {date} তারিখে হওয়ার কথা ছিল। আপনি কি এই সপ্তাহে {facility}-তে আসতে পারবেন?"
      ta: "உங்கள் கர்ப்பகாலப் பரிசோதனை {date} அன்று இருந்தது. இந்த வாரம் நீங்கள் {facility}-க்கு வர முடியுமா?"
      te: "మీ గర్భధారణ పరీక్ష {date}న జరగాల్సింది. మీరు ఈ వారం {facility}కి రాగలరా?"
      gu: "તમારી ગર્ભાવસ્થાની તપાસ {date}ના રોજ થવાની હતી. શું તમે આ અઠવાડિયે {facility} આવી શકશો?"
      kn: "ನಿಮ್ಮ ಗರ್ಭಾವಸ್ಥೆಯ ತಪಾಸಣೆ {date} ರಂದು ಆಗಬೇಕಿತ್ತು. ನೀವು ಈ ವಾರ {facility}ಗೆ ಬರಬಹುದೇ?"
      ml: "നിങ്ങളുടെ ഗർഭകാല പരിശോധന {date}-ന് ആയിരുന്നു. ഈ ആഴ്ച നിങ്ങൾക്ക് {facility}-ൽ വരാൻ കഴിയുമോ?"
      mr: "तुमची गरोदरपणाची तपासणी {date} रोजी व्हायची होती. तुम्ही या आठवड्यात {facility} येथे येऊ शकाल का?"
      pa: "ਤੁਹਾਡਾ ਗਰਭ ਅਵਸਥਾ ਦਾ ਚੈੱਕਅੱਪ {date} ਨੂੰ ਹੋਣਾ ਸੀ। ਕੀ ਤੁਸੀਂ ਇਸ ਹਫ਼ਤੇ {facility} ਆ ਸਕਦੇ ਹੋ?"
    - key: bleeding
      kind: danger
      flag_on: "yes"
      findings: [vaginal_bleeding, fluid_leaking]
      en: "Since your last visit, have you had any bleeding, or water leaking?"
      hi: "पिछली जाँच के बाद क्या आपको खून आया है, या पानी निकला है?"
      or: "ଶେଷ ଯାଞ୍ଚ ପରେ ଆପଣଙ୍କର ରକ୍ତସ୍ରାବ ହୋଇଛି, କିମ୍ବା ପାଣି ବାହାରିଛି କି?"
      bn: "গত পরীক্ষার পর থেকে আপনার কি রক্তপাত হয়েছে, বা জল বেরিয়েছে?"
      ta: "கடந்த பரிசோதனைக்குப் பிறகு உங்களுக்கு இரத்தப்போக்கு அல்லது நீர் கசிவு ஏதாவது இருந்ததா?"
      te: "చివరి పరీక్ష తర్వాత మీకు రక్తస్రావం గానీ, నీరు కారడం గానీ జరిగిందా?"
      gu: "છેલ્લી તપાસ પછી શું તમને લોહી પડ્યું છે, અથવા પાણી પડ્યું છે?"
      kn: "ಕಳೆದ ತಪಾಸಣೆಯ ನಂತರ ನಿಮಗೆ ರಕ್ತಸ್ರಾವ ಅಥವಾ ನೀರು ಸೋರುವುದು ಆಗಿದೆಯೇ?"
      ml: "കഴിഞ്ഞ പരിശോധനയ്ക്ക് ശേഷം നിങ്ങൾക്ക് രക്തസ്രാവമോ വെള്ളം പോകലോ ഉണ്ടായോ?"
      mr: "मागील तपासणीनंतर तुम्हाला रक्तस्राव झाला आहे का, किंवा पाण्यासारखा स्राव झाला आहे का?"
      pa: "ਪਿਛਲੀ ਜਾਂਚ ਤੋਂ ਬਾਅਦ ਕੀ ਤੁਹਾਨੂੰ ਖ਼ੂਨ ਪਿਆ ਹੈ, ਜਾਂ ਪਾਣੀ ਨਿਕਲਿਆ ਹੈ?"
    - key: headache
      kind: danger
      flag_on: "yes"
      findings: [headache, visual_disturbance]
      en: "Do you have a headache, or blurred vision?"
      hi: "क्या आपको सिरदर्द है, या धुंधला दिखता है?"
      or: "ଆପଣଙ୍କୁ ମୁଣ୍ଡବିନ୍ଧା ହେଉଛି, କିମ୍ବା ଆଖିରେ ଝାପ୍ସା ଦେଖାଯାଉଛି କି?"
      bn: "আপনার কি মাথাব্যথা আছে, বা চোখে ঝাপসা দেখছেন?"
      ta: "உங்களுக்குத் தலைவலி அல்லது கண் மங்கலாகத் தெரிகிறதா?"
      te: "మీకు తలనొప్పి గానీ, కళ్ళు మసకగా కనిపించడం గానీ ఉందా?"
      gu: "શું તમને માથું દુખે છે, અથવા ઝાંખું દેખાય છે?"
      kn: "ನಿಮಗೆ ತಲೆನೋವು ಇದೆಯೇ, ಅಥವಾ ಕಣ್ಣು ಮಂಜಾಗಿ ಕಾಣುತ್ತಿದೆಯೇ?"
      ml: "നിങ്ങൾക്ക് തലവേദനയോ കാഴ്ച മങ്ങലോ ഉണ്ടോ?"
