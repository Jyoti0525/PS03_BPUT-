# Phone calls only (Twilio): what the keypad means, and the prompt before a free answer is recorded.
phone:
  keypad:
    en: "Press 1 for yes, 2 for no, or 3 if you are not sure."
    hi: "हाँ के लिए 1, ना के लिए 2, या पता न हो तो 3 दबाइए।"
    or: "ହଁ ପାଇଁ 1, ନା ପାଇଁ 2, କିମ୍ବା ଜାଣି ନ ଥିଲେ 3 ଦବାନ୍ତୁ।"
    bn: "হ্যাঁ হলে 1, না হলে 2, আর নিশ্চিত না হলে 3 টিপুন।"
    ta: "ஆம் என்றால் 1, இல்லை என்றால் 2, தெரியாவிட்டால் 3 அழுத்துங்கள்."
    te: "అవును అయితే 1, కాదు అయితే 2, తెలియకపోతే 3 నొక్కండి."
    gu: "હા માટે 1, ના માટે 2, અથવા ખબર ન હોય તો 3 દબાવો."
    kn: "ಹೌದು ಎಂದರೆ 1, ಇಲ್ಲ ಎಂದರೆ 2, ಗೊತ್ತಿಲ್ಲದಿದ್ದರೆ 3 ಒತ್ತಿ."
    ml: "അതെ എങ്കിൽ 1, ഇല്ല എങ്കിൽ 2, അറിയില്ലെങ്കിൽ 3 അമർത്തുക."
    mr: "हो असल्यास 1, नाही असल्यास 2, किंवा माहीत नसल्यास 3 दाबा."
    pa: "ਹਾਂ ਲਈ 1, ਨਹੀਂ ਲਈ 2, ਜਾਂ ਪਤਾ ਨਾ ਹੋਵੇ ਤਾਂ 3 ਦਬਾਓ।"
  after_beep:
    en: "Please speak after the beep."
    hi: "बीप के बाद बोलिए।"
    or: "ବିପ୍ ପରେ କୁହନ୍ତୁ।"
    bn: "বিপ শব্দের পরে বলুন।"
    ta: "பீப் ஒலிக்குப் பிறகு பேசுங்கள்."
    te: "బీప్ శబ్దం తర్వాత మాట్లాడండి."
    gu: "બીપ પછી બોલો."
    kn: "ಬೀಪ್ ಶಬ್ದದ ನಂತರ ಮಾತನಾಡಿ."
    ml: "ബീപ് ശബ്ദത്തിന് ശേഷം സംസാരിക്കുക."
    mr: "बीपनंतर बोला."
    pa: "ਬੀਪ ਤੋਂ ਬਾਅਦ ਬੋਲੋ।"

# Reminder SMS (E5). Never a pregnancy or a condition, even on her own phone: phones are shared and a text stays
# readable. On a phone that is not the patient's own, it only asks the reader to pass on the visit.
sms:
  self:
    en: "Namaste {name}. Your check-up at {facility} was due on {date}. Please come this week."
    hi: "नमस्ते {name}। {facility} में आपकी जाँच {date} को होनी थी। कृपया इस हफ़्ते आइए।"
    or: "ନମସ୍କାର {name}। {facility}ରେ ଆପଣଙ୍କ ଯାଞ୍ଚ {date}ରେ ହେବାର ଥିଲା। ଦୟାକରି ଏହି ସପ୍ତାହରେ ଆସନ୍ତୁ।"
    bn: "নমস্কার {name}। {facility}-তে আপনার পরীক্ষা {date} তারিখে হওয়ার কথা ছিল। অনুগ্রহ করে এই সপ্তাহে আসুন।"
    ta: "வணக்கம் {name}. {facility}-இல் உங்கள் பரிசோதனை {date} அன்று இருந்தது. தயவுசெய்து இந்த வாரம் வாருங்கள்."
    te: "నమస్కారం {name} గారు. {facility}లో మీ పరీక్ష {date}న జరగాల్సింది. దయచేసి ఈ వారం రండి."
    gu: "નમસ્તે {name}. {facility}માં તમારી તપાસ {date}ના રોજ થવાની હતી. કૃપા કરીને આ અઠવાડિયે આવો."
    kn: "ನಮಸ್ಕಾರ {name}. {facility}ಯಲ್ಲಿ ನಿಮ್ಮ ತಪಾಸಣೆ {date} ರಂದು ಆಗಬೇಕಿತ್ತು. ದಯವಿಟ್ಟು ಈ ವಾರ ಬನ್ನಿ."
    ml: "നമസ്കാരം {name}. {facility}-ൽ നിങ്ങളുടെ പരിശോധന {date}-ന് ആയിരുന്നു. ദയവായി ഈ ആഴ്ച വരൂ."
    mr: "नमस्कार {name}. {facility} येथे तुमची तपासणी {date} रोजी व्हायची होती. कृपया या आठवड्यात या."
    pa: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ {name}। {facility} ਵਿੱਚ ਤੁਹਾਡਾ ਚੈੱਕਅੱਪ {date} ਨੂੰ ਹੋਣਾ ਸੀ। ਕਿਰਪਾ ਕਰਕੇ ਇਸ ਹਫ਼ਤੇ ਆਓ।"
  other:
    en: "Namaste. This is {facility}. Please ask {name} to visit {facility} this week."
    hi: "नमस्ते। यह {facility} से संदेश है। कृपया {name} से कहिए कि वे इस हफ़्ते {facility} आएँ।"
    or: "ନମସ୍କାର। ଏହା {facility}ରୁ ବାର୍ତ୍ତା। ଦୟାକରି {name}ଙ୍କୁ କୁହନ୍ତୁ ଯେ ସେ ଏହି ସପ୍ତାହରେ {facility} ଆସନ୍ତୁ।"
    bn: "নমস্কার। এটি {facility} থেকে বার্তা। অনুগ্রহ করে {name}-কে বলুন এই সপ্তাহে {facility}-তে আসতে।"
    ta: "வணக்கம். இது {facility}-இலிருந்து வரும் செய்தி. தயவுசெய்து {name} அவர்களை இந்த வாரம் {facility}-க்கு வரச் சொல்லுங்கள்."
    te: "నమస్కారం. ఇది {facility} నుండి సందేశం. దయచేసి {name} గారిని ఈ వారం {facility}కి రమ్మని చెప్పండి."
    gu: "નમસ્તે. આ {facility} તરફથી સંદેશ છે. કૃપા કરીને {name}ને કહો કે તેઓ આ અઠવાડિયે {facility} આવે."
    kn: "ನಮಸ್ಕಾರ. ಇದು {facility} ಇಂದ ಬಂದ ಸಂದೇಶ. ದಯವಿಟ್ಟು {name} ಅವರಿಗೆ ಈ ವಾರ {facility}ಗೆ ಬರಲು ಹೇಳಿ."
    ml: "നമസ്കാരം. ഇത് {facility}-ൽ നിന്നുള്ള സന്ദേശമാണ്. ദയവായി {name}-നോട് ഈ ആഴ്ച {facility}-ൽ വരാൻ പറയൂ."
    mr: "नमस्कार. हा {facility} कडून संदेश आहे. कृपया {name} यांना या आठवड्यात {facility} येथे यायला सांगा."
    pa: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ। ਇਹ {facility} ਤੋਂ ਸੁਨੇਹਾ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ {name} ਨੂੰ ਕਹੋ ਕਿ ਉਹ ਇਸ ਹਫ਼ਤੇ {facility} ਆਉਣ।"
