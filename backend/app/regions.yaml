  eid: [eid_ul_fitr, eid_ul_adha]
  id: [eid_ul_fitr, eid_ul_adha]
  "ईद": [eid_ul_fitr, eid_ul_adha]
  "ଇଦ": [eid_ul_fitr, eid_ul_adha]
  "ଇଦ୍": [eid_ul_fitr, eid_ul_adha]
  "ঈদ": [eid_ul_fitr, eid_ul_adha]
  "عید": [eid_ul_fitr, eid_ul_adha]

# Seasons. Windows are month-day pairs; a window may cross the new year (winter). "monsoon" takes its dates from the
# region (IMD normals); in a state with `northeast: true`, "the rains" may mean either monsoon, so both are offered. The harvest and sowing windows are national defaults a facility can
# change.
seasons:
  monsoon:
    label: Southwest monsoon (rainy season)
    names: [rains, the rains, rainy season, monsoon, monsoons, barsaat, barsat, baarish, barish, "बरसात", "बारिश", "मानसून", "ବର୍ଷା", "ବର୍ଷାଋତୁ", "ବର୍ଷା ଦିନ", "ବର୍ଷାଦିନ", "বর্ষা", "മഴക്കാലം", "மழைக்காலம்", "వర్షాకాలం", "ಮಳೆಗಾಲ", "ચોમાસું", "पावसाळा"]
    source: imd_2020
  northeast_monsoon:
    label: Northeast monsoon
    names: [northeast monsoon, north east monsoon, retreating monsoon, winter rains, "வடகிழக்கு பருவமழை", "ஐப்பசி மழை"]
    window: ["10-20", "12-31"]
    source: imd_nem
  summer:
    label: Summer (hot season)
    names: [summer, summers, hot season, garmi, garmiyon, "गर्मी", "गर्मियों", "गरमी", "ଖରା", "ଖରାଦିନ", "ଖରା ଦିନ", "ଗ୍ରୀଷ୍ମ", "গরম", "গ্রীষ্ম"]
    window: ["03-01", "05-31"]
    source: imd_seasons
  winter:
    label: Winter (cold season)
    names: [winter, winters, cold season, the cold, sardi, sardiyon, thand, thandi, "सर्दी", "सर्दियों", "ठंड", "ठंडी", "जाड़ा", "ଶୀତ", "ଶୀତଦିନ", "ଶୀତ ଦିନ", "শীত", "শীতকাল"]
    window: ["12-01", "02-28"]
    source: imd_seasons
  kharif_harvest:
    label: Paddy (kharif) harvest
    names: [paddy harvest, rice harvest, kharif harvest, dhan katai, dhaan katai, dhan kataai, "धान कटाई", "धान की कटाई", "ଧାନ କଟା", "ଧାନକଟା", "ଧାନ କାଟିବା"]
    window: ["09-01", "10-31"]
    source: ncert_crops
  rabi_harvest:
    label: Wheat (rabi) harvest
    names: [wheat harvest, rabi harvest, gehun katai, gehu katai, "गेहूं कटाई", "गेहूँ की कटाई", "गेहूं की कटाई"]
    window: ["04-01", "06-30"]
    source: ncert_crops
  kharif_sowing:
    label: Kharif sowing / paddy transplanting
    names: [paddy transplanting, transplanting, ropai, ropni, rupai, kharif sowing, "रोपाई", "धान रोपाई", "ଧାନ ରୁଆ", "ରୁଆ"]
    window: ["06-01", "07-31"]
    source: ncert_crops
  harvest:
    label: Harvest
    names: [harvest, harvest time, katai, kataai, "कटाई", "फसल कटाई", "ଅମଳ"]
    either: [kharif_harvest, rabi_harvest]
    source: ncert_crops

# National default cadre names. Keys: community (village health activist), nurse (auxiliary nurse midwife),
# nutrition (Anganwadi), male (male multipurpose worker), cho (Community Health Officer at Ayushman Arogya Mandir).
cadres:
  community: {en: ASHA, hi: "आशा", or: "ଆଶା", full: Accredited Social Health Activist}
  nurse: {en: ANM, hi: "एएनएम", or: "ଏଏନଏମ", full: Auxiliary Nurse Midwife}
  nutrition: {en: Anganwadi worker, hi: "आंगनवाड़ी कार्यकर्ता", or: "ଅଙ୍ଗନୱାଡ଼ି କର୍ମୀ", full: Anganwadi worker (ICDS)}
  male: {en: MPW, hi: "एमपीडब्ल्यू", or: "ଏମପିଡବ୍ଲୁ", full: Multipurpose Health Worker (male)}
  cho: {en: CHO, hi: "सीएचओ", or: "ସିଏଚଓ", full: Community Health Officer (Ayushman Arogya Mandir)}

# Workplace and campus facilities have their own first-line staff, whatever the state.
facility_type_cadres:
  company_clinic:
    community: {en: First-aider, full: Trained workplace first-aider}
    nurse: {en: OH nurse, full: Occupational health nurse}
  industrial_unit:
    community: {en: First-aider, full: Trained workplace first-aider}
    nurse: {en: OH nurse, full: Occupational health nurse}
  campus:
    community: {en: Peer volunteer, full: Campus health peer volunteer}
    nurse: {en: Campus nurse, full: Campus health centre nurse}

# One entry per state and union territory, named as in the facility directory. monsoon: normal onset and withdrawal
# (MM-DD) at the IMD station named; "nearest" marks a state with no station of its own in Table 2. northeast: the
# state also gets the October–December northeast monsoon. local: festivals of local importance, shown first.
# aliases: a word that means one festival in this region. cadres: state names that differ from the national ones.
