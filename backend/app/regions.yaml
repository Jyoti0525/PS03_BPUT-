# Regional calendar and worker cadres (F5). Facility configuration, not code: a facility's state picks its region
# below, and a supervisor can override any of it for their own facility (Facility.region_config).
#
# Used for one thing in triage: when a patient dates an illness by a festival or season ("since Diwali", "ରଜଠାରୁ",
# "after the rains"), the note shows the approximate date or window next to the patient's words. The onset stays
# VAGUE and the rules never use it; staff confirm the date with the patient.
#
# Rules for this file:
# * Every date has a source. A year whose date was not checked is left out, not guessed. A festival with no date for
#   the year asked about is still recognised, but the note says the date is not in the calendar.
# * Lunar dates move every year; Islamic dates depend on the moon and can differ by a day from what is listed.
version: "2026-10-05"

sources:
  dopt: >-
    Government of India, Department of Personnel and Training: holidays (gazetted and restricted) for Central
    Government offices, 2025; 2026 (O.M. No. 12/2/2023-JCA, 3 July 2025); 2027 (O.M. 16 July 2026).
  odisha_gad: Government of Odisha, General Administration Department holiday lists 2025 and 2026.
  derived: >-
    Worked out from DoPT dates: Ramzan is the 30 days before Id-ul-Fitr; Navratri is the 9 days up to Mahanavami. Approximate
    (± 1–2 days).
  fixed: Fixed date in the Gregorian or solar calendar.
  imd_2020: >-
    India Meteorological Department, CRS Research Report 3/2020 (Pai et al.), New Normal Dates of Onset/Progress and
    Withdrawal of Southwest Monsoon over India, Table 2: normal onset 1961–2019, normal withdrawal 1971–2019. Where the
    report gives no withdrawal date for a southern station, its stated country-wide retreat date (15 October) is used.
  imd_nem: >-
    India Meteorological Department: the northeast monsoon season (October–December) over Tamil Nadu, Puducherry,
    Kerala, coastal Andhra Pradesh and south interior Karnataka; normal onset around 20 October.
  imd_seasons: >-
    India Meteorological Department seasons: winter (January–February), pre-monsoon or hot weather (March–May). The
    cold season people speak of usually includes December.
  ncert_crops: >-
    NCERT Class 10 Geography, Agriculture: kharif crops sown with the monsoon (June–July) and harvested
    September–October; rabi crops sown October–December and harvested April–June.
  nhm: >-
    National Health Mission (MoHFW): ASHA, ANM, MPW, Anganwadi worker (Ministry of Women and Child Development) and
    Community Health Officer at Ayushman Arogya Mandir. State names from the state programmes noted per state.

# How a festival is matched in what the patient said. Latin-script names need a time word before them ("since
# Diwali", "after the puja"); Indic-script and romanised-Hindi names need one after them ("दिवाली से", "ରଜଠାରୁ",
# "holi ke baad"). This keeps "Diwali sweets" or the English word "raja" from being read as a date.
before: [since, after, from, around, during, at the time of, before, till, until]
after: ["से", "के बाद", "के बाद से", "के आसपास", "के समय", "ଠାରୁ", "ପରଠାରୁ", "ପରଠୁ", "ପରେ", "ଠୁ", "ବେଳେ", "ବେଳୁ", "ସମୟରୁ", "ସମୟରେ", "se", "ke baad", "ke baad se", "ke aas paas", "ke time", "theke", "থেকে", "পর থেকে", "முதல்", "నుండి", "ನಿಂದ", "മുതൽ", "થી", "पासून"]

