    monsoon: {onset: "06-11", withdrawal: "10-15", station: Kalingapatnam}
    northeast: true
    local: [makar_sankranti, ugadi, dussehra, ganesh_chaturthi, diwali]
    aliases: {sankranti: makar_sankranti, "సంక్రాంతి": makar_sankranti}
