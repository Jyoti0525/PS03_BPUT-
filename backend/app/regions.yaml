  Delhi: {monsoon: {onset: "06-27", withdrawal: "09-25", station: Delhi}, local: [diwali, holi, eid_ul_fitr, chhath, karwa_chauth]}
  Goa: {monsoon: {onset: "06-05", withdrawal: "10-14", station: Panjim}, local: [christmas, ganesh_chaturthi, diwali]}
  Gujarat:
